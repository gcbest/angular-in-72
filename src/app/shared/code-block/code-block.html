<figure class="code" [class.compact]="compact()">
  <figcaption class="code-head">
    <span class="code-label">
      <span class="dot" aria-hidden="true"></span>
      {{ label() }}
    </span>
    <button
      type="button"
      class="copy"
      [class.copied]="copied()"
      (click)="copy()"
      [attr.aria-label]="copied() ? 'Copied to clipboard' : 'Copy code to clipboard'"
    >
      {{ copied() ? 'Copied' : 'Copy' }}
    </button>
  </figcaption>
  <pre><code [innerHTML]="highlighted()"></code></pre>
</figure>
