<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Angular in 72 Hours — Interview Field Guide</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A three-day Angular curriculum built for React developers preparing for a Karat interview. Signals, RxJS, routing, forms, DI, and live-coding drills."
    />
    <meta name="theme-color" content="#0b0b0c" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ng72.theme');
          var theme =
            saved ||
            (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
